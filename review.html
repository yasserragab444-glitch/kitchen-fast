<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>قيّم طلبك | كيتشن فاست</title>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#131313;--line:#2b2b2b;--tx:#f5f3ee;--mut:#a9a69d;--gold:#f6b800;--fire:#ff6a1a;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.7 Tajawal,Tahoma,sans-serif;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
h1{font-family:'El Messiri',Tajawal,serif;font-size:clamp(26px,6vw,34px);color:var(--gold);margin:0 0 6px;line-height:1.3}
button,textarea{font:inherit;color:inherit}
.box{width:min(480px,100%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px;display:grid;gap:16px}
.logo{width:72px;border-radius:10px}
.mut{color:var(--mut);margin:0}
.stars{display:flex;flex-direction:row-reverse;justify-content:center;gap:6px}
.stars input{position:absolute;opacity:0;pointer-events:none}
.stars label{font-size:44px;line-height:1;color:#3a3a3a;cursor:pointer;padding:0 2px;transition:color .15s}
.stars label:hover,.stars label:hover~label,.stars input:checked~label{color:var(--gold)}
.stars input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
textarea{width:100%;background:#000;border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.btn{background:var(--fire);color:#000;font-weight:700;border:0;border-radius:8px;padding:12px 30px;cursor:pointer}
.btn:disabled{background:#333;color:var(--mut);cursor:default}
.err{color:#ff7b72;font-size:15px;min-height:1.2em;margin:0}
.ok{background:#1d1708;border:1px solid var(--gold);border-radius:8px;padding:14px 16px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main class="box" id="box"><p class="mut">جاري التحميل...</p></main>
<script>
const SB='https://kqvoknmhokasppkwewoo.supabase.co',KEY='sb_publishable__6-VwjmP68SmIbxFGV3-dg_xSfCGdnr';
const box=document.getElementById('box');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('t')||'';
const rpc=async(fn,body)=>{
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||'حدث خطأ، حاول تاني.');
  return j;
};
const head='<img class="logo" src="img/logo.png" alt="شعار كيتشن فاست">';
const msg=(t,d)=>{box.innerHTML=head+'<h1>'+t+'</h1><p class="mut">'+d+'</p>'};
async function init(){
  if(!token)return msg('الرابط غير صحيح','اطلب رابط التقييم من كيتشن فاست على واتساب.');
  let o;
  try{o=await rpc('get_review_order',{p_token:token})}catch(e){return msg('تعذر تحميل الصفحة',esc(e.message))}
  if(!o.found)return msg('الرابط غير صحيح','اطلب رابط التقييم من كيتشن فاست على واتساب.');
  if(o.reviewed)return msg('وصلنا تقييمك','شكراً ليك على وقتك.');
  if(!o.delivered)return msg('التقييم لسه مش متاح','هيفتح بعد توصيل طلبك '+esc(o.order_number)+'.');
  box.innerHTML=head+`<div><h1>رأيك في طلبك</h1><p class="mut">أهلاً ${esc(o.customer_name)}، طلب رقم ${esc(o.order_number)}. قيّم تجربتك معانا.</p></div>
  <form id="f" style="display:grid;gap:16px">
  <div class="stars" role="radiogroup" aria-label="التقييم">${[5,4,3,2,1].map(i=>`<input type="radio" name="r" id="s${i}" value="${i}"><label for="s${i}" title="${i} من 5" aria-label="${i} من 5">★</label>`).join('')}</div>
  <textarea id="c" rows="4" maxlength="500" placeholder="اكتب رأيك (اختياري)"></textarea>
  <p class="err" id="e"></p>
  <button class="btn" type="submit">إرسال التقييم</button></form>`;
  document.getElementById('f').onsubmit=async ev=>{
    ev.preventDefault();
    const r=document.querySelector('[name=r]:checked'),er=document.getElementById('e');
    if(!r)return er.textContent='اختار عدد النجوم الأول.';
    er.textContent='';const b=ev.submitter;b.disabled=true;
    try{
      await rpc('submit_review',{p_token:token,p_rating:+r.value,p_comment:document.getElementById('c').value.trim()});
      box.innerHTML=head+'<div class="ok"><h1>شكراً ليك!</h1><p class="mut">وصلنا تقييمك، ورأيك بيفرق معانا.</p></div>';
    }catch(x){er.textContent=x.message;b.disabled=false}
  };
}
init();
</script>
</body>
</html>
