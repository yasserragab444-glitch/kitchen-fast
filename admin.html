<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة كيتشن فاست</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style id="pg">@page{size:80mm auto;margin:0}</style>
<style>
:root{--bg:#000;--card:#131313;--line:#2b2b2b;--tx:#f5f3ee;--mut:#a9a69d;--gold:#f6b800;--fire:#ff6a1a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Tajawal,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
label input[type=checkbox]{width:auto;margin-inline-end:6px}
header{display:flex;align-items:center;gap:12px;padding:12px 4vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:20px;margin:0;color:var(--gold);margin-inline-end:auto}
nav{display:flex;gap:8px;padding:12px 4vw;overflow:auto}
nav button{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 18px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
main{padding:0 4vw 60px;max-width:1000px;margin:0 auto;display:grid;gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.r>input,.r>select{flex:1 1 140px}
.l{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:#000;border:0;border-radius:8px;padding:7px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.b.d{background:#3a1010;color:#ff8a80}
.b.wa{background:#1faa59;color:#fff}
.b.pr{background:#f5f3ee;color:#000}
.g{color:var(--gold)}.m{color:var(--mut)}.err{color:#ff7b72}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#222;display:inline-block}
summary{cursor:pointer;color:var(--gold)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px;width:min(380px,100%)}
#t{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#1d1708;border:1px solid var(--gold);padding:8px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
#t.on{opacity:1}#t.bad{border-color:#ff7b72;background:#2a0f0f}

/* نافذة الفاتورة وتصميم الريسيت مطابق للكود المرفق */
#rmodal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:none;place-items:start center;padding:16px;overflow:auto}
#rmodal.on{display:grid}
.rbox{background:#181818;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;width:min(540px,100%)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.irow{display:grid;grid-template-columns:3fr 2fr 1.3fr auto;gap:6px;margin-bottom:6px}
.irow button{padding:6px 10px;background:#3a1010;color:#ff8a80;border:0;border-radius:8px;cursor:pointer;font-weight:700}
.ractions{display:flex;flex-wrap:wrap;gap:8px}
.ractions button{flex:1 1 auto}
#rcw{overflow-x:auto;padding:6px 0;background:#0d0d0d;border-radius:10px}

#rc{background:#fff;color:#000;margin:0 auto;padding:3mm;font-family:Tahoma,Arial,sans-serif;font-size:13px;line-height:1.45;border:1px dashed #999;font-weight:700;direction:rtl}
#rc *{color:#000;box-sizing:border-box}
#rc img.lg{display:block;margin:0 auto 2px;width:72%}
#rc .c{text-align:center}
#rc .tg{font-size:13px}
#rc hr{border:0;border-top:2px solid #000;margin:5px 0}
#rc hr.d{border-top:1px dashed #000}
#rc .bx{border:2px solid #000;border-radius:8px;padding:3px 8px;text-align:center;font-size:16px;font-weight:800;margin:4px 0;direction:ltr}
#rc .sec{font-weight:800;font-size:14px;margin-top:3px}
#rc .r{display:flex;justify-content:space-between;gap:6px}
#rc .th,#rc .tr{display:grid;grid-template-columns:2.3fr 1.4fr 1fr;gap:4px;padding:3px 4px}
#rc .th{background:#000;color:#fff !important;font-weight:800}
#rc .th span{color:#fff !important}
#rc .tr{border-bottom:1px solid #000}
#rc .tr span:last-child,#rc .th span:last-child{text-align:left}
#rc .tt{display:flex;justify-content:space-between;border:2px solid #000;border-radius:8px;padding:4px 8px;font-size:18px;font-weight:800;margin:5px 0}
#rc svg{width:26mm;height:26mm;display:block;margin:3px auto}

@media print{
  body{background:#fff !important;margin:0;padding:0}
  #login,#app,#t,.rbox>*:not(#rcw){display:none !important}
  #rmodal{position:static !important;display:block !important;background:#fff !important;padding:0 !important}
  .rbox{background:#fff !important;border:0 !important;padding:0 !important;width:auto !important}
  #rcw{overflow:visible !important;padding:0 !important;background:#fff !important}
  #rc{border:0 !important;margin:0 !important}
}
</style>
</head>
<body>
<div id="login">
<form id="lf"><h1 class="g" style="margin:0">لوحة إدارة كيتشن فاست</h1>
<label>الإيميل<input id="em" type="email" autocomplete="username" required></label>
<label>كلمة السر<input id="pw" type="password" autocomplete="current-password" required></label>
<p class="err" id="le"></p>
<button class="b" type="submit">دخول</button></form>
</div>
<div id="app" hidden>
<header><h1>كيتشن فاست | الإدارة</h1><button class="b d" id="lo">خروج</button></header>
<nav id="nav"></nav>
<main id="v"></main>
</div>

<!-- نافذة معاينة وتعديل وطباعة الريسيت -->
<div id="rmodal" role="dialog" aria-modal="true" aria-label="معاينة الفاتورة">
  <div class="rbox">
    <div class="r" style="justify-content:space-between">
      <b class="g" style="font-size:18px">🧾 معاينة وطباعة الفاتورة</b>
      <button class="b d" id="btn-close-rm" style="padding:4px 12px">× إغلاق</button>
    </div>
    <details id="rm-edit">
      <summary>تعديل بيانات الفاتورة قبل الطباعة أو الإرسال</summary>
      <div style="display:grid;gap:8px;margin-top:8px">
        <div class="g2">
          <label>رقم الفاتورة<input id="r-no"></label>
          <label>طريقة الدفع<input id="r-py"></label>
        </div>
        <div class="g2">
          <label>اسم العميل<input id="r-nm"></label>
          <label>الموبايل<input id="r-ph" inputmode="tel"></label>
        </div>
        <label>العنوان<input id="r-ad"></label>
        <label>ملاحظات<input id="r-nt"></label>
        <label>الأصناف (الصنف / الكمية / السعر)</label>
        <div id="r-its"></div>
        <button class="b" type="button" id="r-add-it" style="justify-self:start">+ إضافة صنف</button>
        <div class="g2">
          <label>الخصم (ج)<input id="r-dc" type="number" min="0" value="0"></label>
          <label>خدمة التوصيل (ج)<input id="r-dl" type="number" min="0" value="0"></label>
        </div>
      </div>
    </details>
    <div class="r">
      <label style="flex:0 0 115px">مقاس الورق
        <select id="r-wd"><option value="80" selected>80 مم</option><option value="58">58 مم</option></select>
      </label>
      <div class="ractions" style="flex:1">
        <button class="b pr" id="btn-print">🖨️ طباعة</button>
        <button class="b wa" id="btn-wa-img">📲 إرسال واتساب (صورة + تفاصيل)</button>
        <button class="b" id="btn-dl-img">⬇️ حفظ صورة</button>
      </div>
    </div>
    <div id="rcw"><div id="rc"></div></div>
  </div>
</div>

<div id="t"></div>
