<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة كيتشن فاست</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#131313;--line:#2b2b2b;--tx:#f5f3ee;--mut:#a9a69d;--gold:#f6b800;--fire:#ff6a1a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Tajawal,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
label input[type=checkbox]{width:auto;margin-inline-end:6px}
header{display:flex;align-items:center;gap:12px;padding:12px 4vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:20px;margin:0;color:var(--gold);margin-inline-end:auto}
nav{display:flex;gap:8px;padding:12px 4vw;overflow:auto}
nav button{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 18px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
main{padding:0 4vw 60px;max-width:1000px;margin:0 auto;display:grid;gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.r>input,.r>select{flex:1 1 140px}
.l{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.b{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:8px;padding:7px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.b.d{background:#3a1010;color:#ff8a80}
.g{color:var(--gold)}.m{color:var(--mut)}.err{color:#ff7b72}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#222;display:inline-block}
summary{cursor:pointer;color:var(--gold)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px;width:min(380px,100%)}
#t{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#1d1708;border:1px solid var(--gold);padding:8px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#t.on{opacity:1}#t.bad{border-color:#ff7b72;background:#2a0f0f}
#al{position:fixed;top:0;inset-inline:0;z-index:30;color:#000;padding:10px 4vw;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-weight:700;animation:pl .8s infinite alternate}
#al .b{background:#000;color:#fff}
#al .b.d{background:#3a1010;color:#ff8a80}
@keyframes pl{from{background:#ff6a1a}to{background:#f6b800}}
#snd{position:fixed;bottom:70px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;z-index:30;background:#3a1010;color:#ff8a80;border:1px solid #ff7b72;padding:8px 16px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="login">
<form id="lf"><h1 class="g" style="margin:0">لوحة إدارة كيتشن فاست</h1>
<label>الإيميل<input id="em" type="email" autocomplete="username" required></label>
<label>كلمة السر<input id="pw" type="password" autocomplete="current-password" required></label>
<p class="err" id="le"></p>
<button class="b" type="submit">دخول</button></form>
</div>
<div id="app" hidden>
<div id="al" hidden></div><div id="snd" hidden>الصوت متوقف في المتصفح. اضغط هنا لتفعيل صوت تنبيه الطلبات</div>
<header><h1>كيتشن فاست | الإدارة</h1><button class="b" id="tst">تجربة الصوت</button><button class="b d" id="lo">خروج</button></header>
<nav id="nav"></nav>
<main id="v"></main>
</div>
<div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const sb=supabase.createClient('https://kqvoknmhokasppkwewoo.supabase.co','sb_publishable__6-VwjmP68SmIbxFGV3-dg_xSfCGdnr');
const $=id=>document.getElementById(id),V=$('v');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>(+x).toLocaleString('en-US');
const ok=r=>{if(r.error)throw r.error;return r.data};
const ST={new:'جديد',review:'قيد المراجعة',confirmed:'تم التأكيد',preparing:'قيد التجهيز',out:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغي'};
const wa=(o,t)=>`https://wa.me/20${o.phone.slice(1)}?text=${encodeURIComponent(t)}`;
const w=q=>+q==.5?'نص كيلو':n(q)+' كيلو';
const feeTxt=o=>+o.delivery_fee>0?`\nالأصناف: ${o.subtotal-(o.discount||0)} ج + التوصيل: ${o.delivery_fee} ج\nالإجمالي: ${o.total} ج`:'';
function toast(m,bad){const t=$('t');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)}
const fail=e=>toast(e.message||'حدث خطأ',1);
/* ---------- تنبيه الطلبات الجديدة: صوت بيفضل يرن لحد ما تقبل الطلب ---------- */
const baseTitle=document.title;let pendList=[],ringT=null,actx=null,wl=null;
function ctx(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state=='suspended')actx.resume();return actx}catch(e){return null}}
function tone(f,t0,d,g){const c=ctx();if(!c)return;const o=c.createOscillator(),v=c.createGain();o.type='square';o.frequency.value=f;o.connect(v);v.connect(c.destination);const t=c.currentTime+t0;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)}
function ring(){[0,.22,.44,.66].forEach((t,i)=>tone(i%2?1175:880,t,.18,.3))}
function startRing(){if(ringT)return;ring();ringT=setInterval(ring,2200)}
function stopRing(){clearInterval(ringT);ringT=null}
function updSnd(){const e=$('snd');if(e)e.hidden=!!(actx&&actx.state=='running')}
function renderAlert(){
  const a=$('al'),c=pendList.length;
  if(!c){a.hidden=true;document.title=baseTitle;return}
  const o=pendList[0];a.hidden=false;
  a.innerHTML=`<div>🔔 طلب جديد ${esc(o.order_number)} · ${esc(o.customer_name)} · ${n(o.total)} ج${c>1?' (+'+(c-1)+' طلبات تانية)':''}</div><div class="r"><button class="b" data-al="acc" data-id="${o.id}">قبول الطلب</button><button class="b d" data-al="rej" data-id="${o.id}" data-n="${esc(o.order_number)}">رفض</button><button class="b" data-al="view">عرض الطلبات</button></div>`;
  document.title='('+c+') طلب جديد - '+baseTitle;
}
async function poll(){
  try{
    const r=await sb.from('orders').select('id,order_number,customer_name,total,created_at').eq('status','new').order('created_at',{ascending:true}).limit(20);
    if(r.error||!r.data)return;
    const prev=pendList.map(o=>o.id).join(),now=r.data.map(o=>o.id).join();
    pendList=r.data;renderAlert();
    if(pendList.length){startRing();updSnd()}else stopRing();
    if(prev!==now&&cur=='orders')tab('orders');
  }catch(e){}
}
async function acceptOrder(id){ok(await sb.from('orders').update({status:'confirmed'}).eq('id',id));toast('تم قبول الطلب');await poll()}
async function rejectOrder(id,num){if(!confirm('رفض الطلب '+num+'؟ هتتغير حالته لـ ملغي.'))return false;ok(await sb.from('orders').update({status:'cancelled'}).eq('id',id));toast('تم رفض الطلب');await poll();return true}
async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){keepAwake();if(!$('app').hidden)poll()}});
document.addEventListener('click',()=>{ctx();setTimeout(updSnd,250)});

/* ---------- الفاتورة: طباعة حرارية 80mm + إرسال واتساب ---------- */
let OD={},ST_INFO={tagline:'متخصصون في المشويات الجاهزة',whatsapp:'201066989850'};
const RC={phone2:'01143986560'}; /* رقم تواصل إضافي يظهر في الفاتورة، امسحه لو مش عايزه */
async function loadStore(){try{const r=await sb.from('store_settings').select('tagline,whatsapp').eq('id',1).single();if(r.data){if(r.data.tagline)ST_INFO.tagline=r.data.tagline;if(r.data.whatsapp)ST_INFO.whatsapp=r.data.whatsapp}}catch(e){}}
function qrSvg(text,px){try{if(typeof qrcode==='undefined')return '';const q=qrcode(0,'M');q.addData(text);q.make();const c=q.getModuleCount();let d='';for(let r=0;r<c;r++)for(let k=0;k<c;k++)if(q.isDark(r,k))d+='M'+k+' '+r+'h1v1h-1z';return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ${c+4} ${c+4}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${c+4}" height="${c+4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}catch(e){return ''}}
const localPhone=x=>/^20\d{10}$/.test(x||'')?'0'+x.slice(2):(x||'');
function receiptHTML(o){
  const wn=ST_INFO.whatsapp||'',fee=+o.delivery_fee||0,dc=+o.discount||0;
  const items=(o.order_items||[]).map(i=>`<tr><td>${esc(i.product_name)}</td><td>${w(i.quantity_kg)}</td><td class="p">${n(i.line_total)} ج</td></tr>`).join('');
  const ex=[];if(dc>0||fee>0)ex.push(['إجمالي الأصناف',n(o.subtotal)+' ج']);if(dc>0)ex.push(['الخصم','- '+n(dc)+' ج']);ex.push(['التوصيل',fee>0?n(fee)+' ج':'يتحدد حسب المنطقة']);
  const date=new Date(o.created_at).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
  const qr=qrSvg('https://wa.me/'+wn,104);
  return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فاتورة ${esc(o.order_number)}</title><style>
@page{size:80mm auto;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000}
body{font:700 13px/1.55 Tahoma,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r{width:72mm;margin:0 auto;padding:4mm 2mm 6mm}
.c{text-align:center}
.lg{width:15mm;height:15mm;border:2px solid #000;border-radius:50%;margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font:900 19px Arial,sans-serif}
.en{font:900 19px Arial,sans-serif;letter-spacing:.5px}
.ar{font-size:19px;font-weight:900}
.tg{font-size:12px;font-weight:400}
.sm{font-size:11px}
.ttl{font-size:16px;margin:6px 0 2px}
hr{border:0;margin:7px 0}
hr.s{border-top:2px solid #000}
hr.d{border-top:1px dashed #000}
.bx{border:2px solid #000;border-radius:7px;text-align:center;font:900 17px Arial,sans-serif;padding:3px;margin:5px 0 3px}
.h{font-size:14px;margin-top:6px}
.kv{display:flex;gap:8px;margin:2px 0}
.kv span{flex:none;font-weight:400}
table{width:100%;border-collapse:collapse;margin:2px 0}
th{background:#000;color:#fff;padding:3px 4px;font-size:12px;text-align:right}
th:last-child,td.p{text-align:left;white-space:nowrap}
td{padding:4px;border-bottom:1px solid #000;font-size:12px;font-weight:400}
td:first-child{font-weight:700}
.ex{margin-top:4px}
.ex .kv{justify-content:space-between}
.tot{border:2px solid #000;border-radius:7px;padding:4px 8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:900}
.qr{margin:6px auto 2px;width:104px;height:104px}
.qr svg{display:block}
</style></head><body><div class="r">
<div class="c"><div class="lg">KF</div><div class="en">KITCHEN FAST</div><div class="ar">كيتشن فاست</div><div class="tg">${esc(ST_INFO.tagline)}</div></div>
<hr class="s">
<div class="c ttl">فاتورة طلب من كيتشن فاست</div><div class="c sm">ORDER RECEIPT</div>
<div class="bx">${esc(o.order_number)}</div>
<div class="c sm" dir="ltr">${esc(date)}</div>
<div class="h">بيانات العميل</div><hr class="d" style="margin:3px 0 5px">
<div class="kv"><span>الاسم</span><b>${esc(o.customer_name)}</b></div>
<div class="kv"><span>الموبايل</span><b dir="ltr">${esc(o.phone)}</b></div>
<div class="kv"><span>العنوان</span><b>${esc(o.address)} ${esc(o.area||'')}</b></div>
<hr class="s" style="margin:6px 0">
<table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th></tr></thead><tbody>${items}</tbody></table>
<div class="ex">${ex.map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
<div class="tot"><span>الإجمالي</span><span>${n(o.total)} ج</span></div>
<div class="kv"><span>طريقة الدفع</span><b>${esc(o.payment_method)}</b></div>
${o.notes?`<div class="kv"><span>ملاحظات</span><b>${esc(o.notes)}</b></div>`:''}
<hr class="d">
<div class="c"><div style="font-size:15px;font-weight:900">شكرًا لاختيارك كيتشن فاست</div><div class="tg">منتجات مجهزة بعناية</div>
${qr?`<div class="qr">${qr}</div><div class="sm" style="font-weight:400">امسح الرمز للتواصل عبر واتساب</div>`:''}
<div style="margin-top:4px">واتساب: <span dir="ltr">${esc(localPhone(wn))}</span></div>
${RC.phone2?`<div>للتواصل: <span dir="ltr">${esc(RC.phone2)}</span></div>`:''}</div>
<hr class="s">
<div class="c"><div style="font:900 13px Arial,sans-serif">KITCHEN FAST</div><div class="tg">نتمنى لك وجبة شهية</div></div>
</div><script>onafterprint=function(){if(window===window.top)close()};onload=function(){setTimeout(function(){print()},300)}<\/script></body></html>`;
}
function printReceipt(o){
  if(!o)return toast('تعذر تحميل بيانات الطلب',1);
  const html=receiptHTML(o),wd=window.open('','_blank','width=420,height=720');
  if(wd){wd.document.open();wd.document.write(html);wd.document.close();return}
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  f.contentDocument.open();f.contentDocument.write(html);f.contentDocument.close();setTimeout(()=>f.remove(),60000);
}
function invoiceText(o){
  const fee=+o.delivery_fee||0,dc=+o.discount||0;
  const L=['*كيتشن فاست*','فاتورة طلب رقم *'+o.order_number+'*','',...(o.order_items||[]).map(i=>'• '+i.product_name+' × '+w(i.quantity_kg)+' = '+n(i.line_total)+' ج'),''];
  if(dc>0)L.push('الخصم: '+n(dc)+' ج');
  L.push(fee>0?'التوصيل: '+n(fee)+' ج':'التوصيل: يتحدد حسب المنطقة');
  L.push('*الإجمالي: '+n(o.total)+' ج*','طريقة الدفع: '+o.payment_method,'','شكراً لاختيارك كيتشن فاست');
  return L.join('\n');
}
const TABS={orders:['الطلبات',orders],products:['المنتجات',products],reviews:['التقييمات',reviews],settings:['الإعدادات',settings]};
$('nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-k="${k}">${v[0]}</button>`).join('');
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.k)};
function tab(k){[...$('nav').children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));V.innerHTML='<p class="m">جاري التحميل...</p>';TABS[k][1]().catch(e=>{V.innerHTML='<p class="err">'+esc(e.message)+'</p>'})}
let cur='orders';
const go=k=>{cur=k;tab(k)};
async function enter(){
  const r=await sb.from('admins').select('user_id').maybeSingle();
  if(!r.data){await sb.auth.signOut();$('le').textContent='هذا الحساب ليس لديه صلاحية الإدارة.';$('login').hidden=false;$('app').hidden=true;return}
  $('login').hidden=true;$('app').hidden=false;loadStore();go('orders');keepAwake();updSnd();poll();if(!poll.t)poll.t=setInterval(poll,8000);
}
$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';ctx();
  const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(r.error)return $('le').textContent='الإيميل أو كلمة السر غير صحيحة.';
  enter()};
$('lo').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('tst').onclick=()=>{ctx();ring();setTimeout(updSnd,250)};
$('al').onclick=async e=>{const b=e.target.closest('[data-al]');if(!b)return;ctx();try{if(b.dataset.al=='view')go('orders');else if(b.dataset.al=='rej'){if(await rejectOrder(b.dataset.id,b.dataset.n)&&cur=='orders')tab('orders')}else{await acceptOrder(b.dataset.id);if(cur=='orders')tab('orders')}}catch(x){fail(x)}};
sb.auth.getSession().then(({data})=>{if(data.session)enter()});

async function orders(){
  const d=ok(await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100));
  OD={};d.forEach(o=>OD[o.id]=o);
  V.innerHTML=d.length?d.map(o=>`<div class="c" data-id="${o.id}" data-sub="${o.subtotal}" data-disc="${o.discount||0}"><div class="r"><b>${esc(o.order_number)}</b><span>${esc(o.customer_name)} · <span dir="ltr">${esc(o.phone)}</span></span><b class="g">${n(o.total)} ج</b>
${o.status=='new'?'<button class="b" data-a="acc">قبول الطلب</button><button class="b d" data-a="rej">رفض</button>':''}<select data-a="st">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${o.status==k?' selected':''}>${v}</option>`).join('')}</select></div>
<details><summary>التفاصيل</summary><p>${new Date(o.created_at).toLocaleString('en-US')}<br>العنوان: ${esc(o.address)} ${esc(o.area||'')}<br>الدفع: ${esc(o.payment_method)}${o.notes?'<br>ملاحظات: '+esc(o.notes):''}</p>
${o.order_items.map(i=>`<div class="l"><span>${esc(i.product_name)} × ${w(i.quantity_kg)}</span><span>${n(i.line_total)} ج</span></div>`).join('')}
<p>المجموع ${n(o.subtotal)} · خصم ${n(o.discount)}${o.coupon_code?' ('+esc(o.coupon_code)+')':''} · توصيل ${n(o.delivery_fee)}</p>
<div class="r"><label>مصاريف التوصيل (ج)<input type="number" min="0" data-fee value="${+o.delivery_fee||0}"></label><button class="b" data-a="fee">حفظ التوصيل</button></div>
<div class="r"><button class="b" data-a="print">طباعة الفاتورة (80mm)</button><a class="b" target="_blank" rel="noopener" href="${wa(o,invoiceText(o))}">إرسال الفاتورة واتساب</a></div>
<a class="b" target="_blank" rel="noopener" href="${wa(o,`مرحباً ${o.customer_name}، بخصوص طلبك ${o.order_number} من كيتشن فاست: ${ST[o.status]}${feeTxt(o)}`)}">واتساب العميل</a>
${o.status=='delivered'?` <a class="b" target="_blank" rel="noopener" href="${wa(o,`شكراً لتعاملك مع كيتشن فاست! يسعدنا رأيك في طلبك: ${location.origin}${location.pathname.replace(/[^/]*$/,'')}review.html?t=${o.review_token}`)}">إرسال رابط التقييم</a>`:''}</details></div>`).join(''):'<p class="m">لا توجد طلبات بعد.</p>';
}

let CATS=[];
async function products(){
  CATS=ok(await sb.from('categories').select('*').order('sort_order'));
  const d=ok(await sb.from('products').select('*').order('sort_order'));
  const HD=d.length>0&&('description' in d[0]);
  const co=v=>CATS.map(c=>`<option value="${c.id}"${c.id==v?' selected':''}>${esc(c.name)}</option>`).join('');
  V.innerHTML=(d.length&&!HD?'<p class="m">لإضافة خانة وصف المنتج، شغّل ملف product-description.sql في Supabase.</p>':'')+`<div class="c" id="np"><b>صنف جديد</b><div class="r"><input data-f="name" placeholder="اسم الصنف"><select data-f="category_id">${co()}</select><input data-f="price_per_kg" type="number" min="0" placeholder="سعر الكيلو">${HD?'<input data-f="description" placeholder="وصف مختصر (اختياري)">':''}<button class="b" data-a="add">إضافة</button></div></div>`+
  d.map(p=>`<div class="c" data-id="${p.id}"><div class="r">${p.image_url?`<img class="th" src="${esc(p.image_url)}" alt="">`:'<span class="th"></span>'}<input data-f="name" value="${esc(p.name)}"><select data-f="category_id">${co(p.category_id)}</select><label>السعر / كيلو<input data-f="price_per_kg" type="number" min="0" value="${p.price_per_kg}"></label><label>خصم %<input data-f="discount_percent" type="number" min="0" max="100" value="${p.discount_percent}"></label></div>
${HD?`<label>وصف المنتج (يظهر في المتجر)<textarea data-f="description" rows="2" maxlength="200">${esc(p.description||'')}</textarea></label>`:''}
<div class="r">${[['is_available','متاح'],['is_best_seller','الأكثر طلباً'],['is_new','جديد'],['is_active','ظاهر في المتجر']].map(([k,l])=>`<label><span><input type="checkbox" data-f="${k}"${p[k]?' checked':''}>${l}</span></label>`).join('')}
<label class="b">رفع صورة<input type="file" accept="image/*" data-a="img" hidden></label><button class="b" data-a="save">حفظ</button><button class="b d" data-a="del">حذف</button></div></div>`).join('');
}
const rd=c=>{const o={};c.querySelectorAll('[data-f]').forEach(e=>o[e.dataset.f]=e.type=='checkbox'?e.checked:e.type=='number'?(e.value===''?null:+e.value):e.value);return o};
async function up(f){
  if(f.size>5e6)throw new Error('الصورة كبيرة (أقصى حجم 5 ميجا)');
  const p=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+((f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').slice(0,5)||'jpg');
  ok(await sb.storage.from('store-images').upload(p,f,{contentType:f.type}));
  return sb.storage.from('store-images').getPublicUrl(p).data.publicUrl;
}

async function reviews(){
  const d=ok(await sb.from('reviews').select('*,orders(order_number)').order('created_at',{ascending:false}));
  V.innerHTML=d.length?d.map(r=>`<div class="c" data-id="${r.id}"><div class="r"><b class="g">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</b><span>${esc(r.customer_name)} · ${esc(r.orders?.order_number||'')}</span><span class="${r.is_approved?'g':'m'}">${r.is_approved?'ظاهر':'بانتظار الموافقة'}</span></div><p>${esc(r.comment||'')}</p><div class="r"><button class="b" data-a="ap" data-v="${r.is_approved?0:1}">${r.is_approved?'إخفاء':'اعتماد'}</button><button class="b d" data-a="rd">حذف</button></div></div>`).join(''):'<p class="m">لا توجد تقييمات بعد.</p>';
}

const SF=[['tagline','الشعار'],['whatsapp','رقم واتساب (بصيغة 20...)'],['payment_number','رقم التحويل (إنستا باي / محفظة)'],['facebook_url','رابط فيسبوك'],['instagram_url','رابط إنستغرام'],['tiktok_url','رابط تيك توك'],['location_url','رابط اللوكيشن'],['address','العنوان'],['working_hours','مواعيد العمل'],['offers_banner','شريط العروض (افصل بين أكتر من رسالة بعلامة |)'],['min_order','الحد الأدنى للطلب (ج)']];
let HERO=[];
function drawHero(){$('hr').innerHTML=HERO.map((u,i)=>`<span><img class="th" src="${esc(u)}" alt=""><button class="b d" data-a="hrm" data-i="${i}">×</button></span>`).join('')||'<span class="m">لا توجد صور</span>'}
async function settings(){
  const s=ok(await sb.from('store_settings').select('*').eq('id',1).single());
  HERO=s.hero_images||[];
  const HS='open_from' in s;
  const z=(s.delivery_zones||[]).map(x=>x.name+' | '+x.fee).join('\n');
  V.innerHTML=`<div class="c" id="st">${SF.map(([k,l])=>`<label>${l}<input data-f="${k}"${k=='min_order'?' type="number" min="0"':''} value="${esc(s[k]??'')}"></label>`).join('')}
${HS?`<div class="c"><b>مواعيد فتح وغلق المتجر</b><div class="r"><label>يفتح الساعة<input type="time" data-f="open_from" value="${esc((s.open_from||'').slice(0,5))}"></label><label>يقفل الساعة<input type="time" data-f="open_to" value="${esc((s.open_to||'').slice(0,5))}"></label></div><label>رسالة وقت الغلق (اختياري)<input data-f="closed_message" value="${esc(s.closed_message??'')}"></label><label><span><input type="checkbox" data-f="force_closed"${s.force_closed?' checked':''}>إغلاق المتجر الآن (يدوي)</span></label><p class="m" style="margin:0">لو فاضيين وقت الفتح والغلق، المتجر بيفضل مفتوح طول الوقت. لو الغلق بعد منتصف الليل (مثلاً 12 ظهراً لحد 2 بعد نص الليل) اكتب الساعات عادي.</p></div>`:'<p class="m">لتفعيل مواعيد الغلق، شغّل ملف store-hours.sql في Supabase.</p>'}
<label>مناطق التوصيل (سطر لكل منطقة: الاسم | السعر)<textarea data-f="zones" rows="4">${esc(z)}</textarea></label>
<div><b>صور الهيدر</b><div class="r" id="hr"></div><label class="b">إضافة صورة<input type="file" accept="image/*" data-a="hero" hidden></label></div>
<button class="b" data-a="ss">حفظ الإعدادات</button></div>`;
  drawHero();
}

V.onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName=='INPUT'||b.tagName=='SELECT')return;
  const a=b.dataset.a,c=b.closest('[data-id]'),id=c&&c.dataset.id;
  try{
    if(a=='acc'){await acceptOrder(id);go('orders')}
    else if(a=='rej'){if(await rejectOrder(id,c.querySelector('b').textContent))go('orders')}
    else if(a=='print'){printReceipt(OD[id])}
    else if(a=='fee'){const v=+c.querySelector('[data-fee]').value;if(!(v>=0))return toast('اكتب مبلغ صحيح',1);const sub=+c.dataset.sub,dc=+c.dataset.disc||0;ok(await sb.from('orders').update({delivery_fee:v,total:sub-dc+v}).eq('id',id));toast('تم حفظ التوصيل');await orders();const d=V.querySelector('[data-id="'+id+'"] details');if(d)d.open=true}
    else if(a=='add'){const o=rd($('np'));if(!o.name.trim()||o.price_per_kg==null)return toast('اكتب الاسم والسعر',1);ok(await sb.from('products').insert(o));toast('تمت الإضافة');go('products')}
    else if(a=='save'){ok(await sb.from('products').update(rd(c)).eq('id',id));toast('تم الحفظ')}
    else if(a=='del'){if(!confirm('حذف الصنف نهائياً؟'))return;ok(await sb.from('products').delete().eq('id',id));toast('تم الحذف');go('products')}
    else if(a=='ap'){ok(await sb.from('reviews').update({is_approved:b.dataset.v=='1'}).eq('id',id));go('reviews')}
    else if(a=='rd'){if(!confirm('حذف التقييم؟'))return;ok(await sb.from('reviews').delete().eq('id',id));go('reviews')}
    else if(a=='hrm'){HERO.splice(+b.dataset.i,1);drawHero()}
    else if(a=='ss'){
      const o=rd($('st')),z=(o.zones||'').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[0]).map(x=>({name:x[0],fee:+x[1]||0}));
      delete o.zones;for(const k in o)if(o[k]==='')o[k]=null;
      o.min_order=o.min_order||0;o.delivery_zones=z;o.hero_images=HERO;
      ok(await sb.from('store_settings').update(o).eq('id',1));toast('تم حفظ الإعدادات');
    }
  }catch(x){fail(x)}
};
V.onchange=async e=>{
  const el=e.target,a=el.dataset.a,c=el.closest('[data-id]');
  try{
    if(a=='st'){ok(await sb.from('orders').update({status:el.value}).eq('id',c.dataset.id));toast('تم تحديث الحالة');go('orders');poll()}
    else if(a=='img'&&el.files[0]){toast('جاري رفع الصورة...');const u=await up(el.files[0]);ok(await sb.from('products').update({image_url:u}).eq('id',c.dataset.id));toast('تم رفع الصورة');go('products')}
    else if(a=='hero'&&el.files[0]){toast('جاري رفع الصورة...');HERO.push(await up(el.files[0]));drawHero();toast('اضغط حفظ الإعدادات لتثبيت الصورة')}
  }catch(x){fail(x)}
};
</script>
</body>
</html>
