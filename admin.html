<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة كيتشن فاست</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#131313;--line:#2b2b2b;--tx:#f5f3ee;--mut:#a9a69d;--gold:#f6b800;--fire:#ff6a1a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Tajawal,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#000;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
label input[type=checkbox]{width:auto;margin-inline-end:6px}
header{display:flex;align-items:center;gap:12px;padding:12px 4vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:20px;margin:0;color:var(--gold);margin-inline-end:auto}
nav{display:flex;gap:8px;padding:12px 4vw;overflow:auto}
nav button{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 18px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
main{padding:0 4vw 60px;max-width:1000px;margin:0 auto;display:grid;gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.r>input,.r>select{flex:1 1 140px}
.l{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:#000;border:0;border-radius:8px;padding:7px 16px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.b:disabled{opacity:.6;cursor:wait}
.b.d{background:#3a1010;color:#ff8a80}
.b.wa{background:#25D366;color:#000}
.b.pr{background:#f5f3ee;color:#000}
.g{color:var(--gold)}.m{color:var(--mut)}.err{color:#ff7b72;margin:0;font-size:14px}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#222;display:inline-block}
summary{cursor:pointer;color:var(--gold)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login[hidden],#app[hidden]{display:none !important}
#login form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px;width:min(380px,100%)}
#t{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#1d1708;border:1px solid var(--gold);padding:8px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
#t.on{opacity:1}#t.bad{border-color:#ff7b72;background:#2a0f0f}

/* نافذة معاينة الريسيت 80mm */
#rmodal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;place-items:center;padding:16px;overflow:auto}
#rmodal.on{display:grid}
.rbox{background:#181818;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;max-width:100%;justify-items:center}
.ractions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}

/* تصميم الفاتورة الحرارية 80mm */
#receipt-paper{
  width:76mm;
  max-width:100%;
  background:#fff;
  color:#000;
  padding:5mm 4mm 6mm;
  font-family:'Cairo','Tajawal',Tahoma,sans-serif;
  direction:rtl;
  text-align:center;
  line-height:1.45;
  box-shadow:0 8px 30px rgba(0,0,0,.6);
}
#receipt-paper *{color:#000;box-sizing:border-box}
.rp-logo{width:52px;height:52px;border:2.5px solid #000;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:800;font-size:21px;letter-spacing:-1px;font-family:Arial,sans-serif}
.rp-en{font-weight:800;font-size:19px;letter-spacing:.5px;margin:0;font-family:Arial,sans-serif}
.rp-ar{font-weight:800;font-size:19px;margin:0}
.rp-sub{font-size:11.5px;margin:2px 0 8px;font-weight:600}
.rp-hr{border:0;border-top:1.5px solid #000;margin:8px 0}
.rp-dash{border:0;border-top:1px dashed #444;margin:7px 0}
.rp-title{font-weight:800;font-size:15px;margin:4px 0 0}
.rp-subtitle{font-size:10.5px;font-weight:700;letter-spacing:.8px;margin:0 0 8px;font-family:Arial,sans-serif}
.rp-num{border:1.8px solid #000;border-radius:10px;padding:5px 10px;font-weight:800;font-size:17px;margin:0 auto 10px;font-family:Arial,sans-serif;direction:ltr}
.rp-sec-h{text-align:right;font-weight:800;font-size:13.5px;margin:4px 0}
.rp-info{display:grid;gap:4px;font-size:12.5px;margin:6px 0}
.rp-info-row{display:flex;justify-content:space-between;gap:8px;text-align:right}
.rp-info-row span:first-child{font-weight:700;white-space:nowrap}
.rp-info-row span:last-child{font-weight:600;text-align:left}
.rp-tbl{width:100%;border-collapse:collapse;margin:10px 0 6px;font-size:12px}
.rp-tbl thead th{background:#000;color:#fff !important;padding:5px 6px;font-weight:700}
.rp-tbl thead th:first-child{text-align:right}
.rp-tbl thead th:nth-child(2){text-align:center}
.rp-tbl thead th:last-child{text-align:left}
.rp-tbl tbody td{padding:6px 4px;border-bottom:1px solid #ccc;font-weight:600;vertical-align:middle}
.rp-tbl tbody td:first-child{text-align:right;font-weight:700}
.rp-tbl tbody td:nth-child(2){text-align:center;white-space:nowrap}
.rp-tbl tbody td:last-child{text-align:left;font-weight:800;white-space:nowrap}
.rp-extra{display:flex;justify-content:space-between;font-size:12px;padding:3px 4px;font-weight:700}
.rp-tot-box{border:1.8px solid #000;border-radius:10px;padding:6px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.rp-tot-box span:first-child{font-weight:800;font-size:16px}
.rp-tot-box span:last-child{font-weight:800;font-size:19px}
.rp-meta{display:grid;gap:4px;font-size:12.5px;margin:6px 0}
.rp-meta-row{display:flex;justify-content:space-between;gap:8px}
.rp-meta-row span:first-child{font-weight:700}
.rp-meta-row span:last-child{font-weight:800}
.rp-thx{font-weight:800;font-size:13.5px;margin:6px 0 2px}
.rp-thx-sub{font-size:11.5px;font-weight:600;margin:0 0 8px}
.rp-qr{width:110px;height:110px;margin:4px auto;display:grid;place-items:center}
.rp-qr img,.rp-qr canvas{width:110px !important;height:110px !important}
.rp-qr-txt{font-size:11.5px;font-weight:700;margin:4px 0}
.rp-phones{font-size:12.5px;font-weight:800;line-height:1.6;margin:2px 0 6px}
.rp-foot-en{font-weight:800;font-size:12px;letter-spacing:.5px;margin:4px 0 0;font-family:Arial,sans-serif}
.rp-foot-ar{font-size:11.5px;font-weight:600;margin:2px 0 0}

@media print{
  @page{size:80mm auto;margin:0}
  body{background:#fff !important;margin:0;padding:0}
  #login,#app,#t,.ractions{display:none !important}
  #rmodal{position:static !important;display:block !important;background:#fff !important;padding:0 !important}
  .rbox{background:#fff !important;border:0 !important;padding:0 !important;box-shadow:none !important}
  #receipt-paper{width:76mm !important;margin:0 auto !important;box-shadow:none !important;padding:3mm 3mm 5mm !important}
}
</style>
</head>
<body>
<div id="login">
<form id="lf"><h1 class="g" style="margin:0">لوحة إدارة كيتشن فاست</h1>
<label>الإيميل<input id="em" type="email" autocomplete="username" required></label>
<label>كلمة السر<input id="pw" type="password" autocomplete="current-password" required></label>
<p class="err" id="le"></p>
<button class="b" id="lbtn" type="submit">دخول</button></form>
</div>
<div id="app" hidden>
<header><h1>كيتشن فاست | الإدارة</h1><button class="b d" id="lo" type="button">خروج</button></header>
<nav id="nav"></nav>
<main id="v"></main>
</div>

<div id="rmodal" role="dialog" aria-modal="true" aria-label="معاينة الفاتورة">
  <div class="rbox">
    <div class="ractions">
      <button class="b pr" id="btn-print" type="button">🖨️ طباعة حرارية 80mm</button>
      <button class="b wa" id="btn-wa-img" type="button">📲 إرسال الصورة + التفاصيل واتساب</button>
      <button class="b" id="btn-dl-img" type="button">⬇️ حفظ صورة</button>
      <button class="b d" id="btn-close-rm" type="button">إغلاق</button>
    </div>
    <div id="receipt-paper"></div>
  </div>
</div>

<div id="t"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>if(!window.supabase)document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const $=id=>document.getElementById(id),V=$('v');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>(+x).toLocaleString('en-US');
const ok=r=>{if(r.error)throw r.error;return r.data};
const ST={new:'جديد',review:'قيد المراجعة',confirmed:'تم التأكيد',preparing:'قيد التجهيز',out:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغي'};
const STORE_URL='https://yasserragab444-glitch.github.io/kitchen-fast/';
let STORE_WA='01066989850';
const SECOND_PHONE='01143986560';
let ORDERS_MAP={};
let ACTIVE_ORDER=null;

const sb=window.supabase?window.supabase.createClient('https://kqvoknmhokasppkwewoo.supabase.co','sb_publishable__6-VwjmP68SmIbxFGV3-dg_xSfCGdnr'):null;

const wa=(o,t)=>`https://wa.me/20${String(o.phone||'').replace(/^0/,'')}?text=${encodeURIComponent(t)}`;
const w=q=>+q==.5?'نصف كيلو':+q==1?'1 كيلو':n(q)+' كيلو';
const feeTxt=o=>+o.delivery_fee>0?`\nالأصناف: ${o.subtotal-(o.discount||0)} ج + التوصيل: ${o.delivery_fee} ج\nالإجمالي: ${o.total} ج`:'';
function toast(m,bad){const t=$('t');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3400)}
const fail=e=>toast(e.message||'حدث خطأ',1);
const baseTitle=document.title;let lastSeen=null,pend=0,actx=null;

function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}catch(e){}}
async function poll(){try{const r=await sb.from('orders').select('created_at').order('created_at',{ascending:false}).limit(1);if(r.error||!r.data)return;const top=r.data[0]&&r.data[0].created_at;if(lastSeen===null){lastSeen=top||'';return}
if(top&&(!lastSeen||new Date(top)>new Date(lastSeen))){const c=lastSeen?await sb.from('orders').select('id',{count:'exact',head:true}).gt('created_at',lastSeen):{count:1};pend+=c.count||1;lastSeen=top;document.title='('+pend+') '+baseTitle;beep();toast('وصل طلب جديد');if(cur=='orders')tab('orders')}}catch(e){}}
window.addEventListener('focus',()=>{pend=0;document.title=baseTitle});

const TABS={orders:['الطلبات',orders],products:['المنتجات',products],reviews:['التقييمات',reviews],settings:['الإعدادات',settings]};
$('nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button type="button" data-k="${k}">${v[0]}</button>`).join('');
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.k)};
function tab(k){[...$('nav').children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));V.innerHTML='<p class="m">جاري التحميل...</p>';TABS[k][1]().catch(e=>{V.innerHTML='<p class="err">'+esc(e.message)+'</p>'})}
let cur='orders';
const go=k=>{cur=k;if(k=='orders'){pend=0;document.title=baseTitle}tab(k)};

async function enter(){
  const r=await sb.from('admins').select('user_id').maybeSingle();
  if(!r.data){
    await sb.auth.signOut();
    $('le').textContent='هذا الحساب ليس لديه صلاحية الإدارة.';
    $('login').hidden=false;
    $('app').hidden=true;
    return;
  }
  sb.from('store_settings').select('whatsapp').eq('id',1).maybeSingle().then(({data})=>{
    if(data&&data.whatsapp){
      const d=String(data.whatsapp).replace(/\D/g,'');
      STORE_WA=d.startsWith('20')?'0'+d.slice(2):d;
    }
  }).catch(()=>{});
  $('login').hidden=true;
  $('app').hidden=false;
  go('orders');
  poll();
  if(!poll.t)poll.t=setInterval(poll,20000);
}

$('lf').onsubmit=async e=>{
  e.preventDefault();
  $('le').textContent='';
  if(!sb){
    $('le').textContent='تعذر تحميل مكتبة الاتصال. تأكد من الإنترنت وأعد تحميل الصفحة.';
    return;
  }
  const btn=$('lbtn');
  btn.disabled=true;
  btn.textContent='جاري الدخول...';
  try{
    const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
    if(r.error){
      $('le').textContent='الإيميل أو كلمة السر غير صحيحة.';
    }else{
      await enter();
    }
  }catch(err){
    $('le').textContent=err.message||'حدث خطأ في الاتصال.';
  }finally{
    btn.disabled=false;
    btn.textContent='دخول';
  }
};

$('lo').onclick=async()=>{if(sb)await sb.auth.signOut();location.reload()};
if(sb)sb.auth.getSession().then(({data})=>{if(data&&data.session)enter()});

function buildWaMessage(o){
  const items=(o.order_items||[]).map(i=>`▪️ ${i.product_name} (${w(i.quantity_kg)}) : *${n(i.line_total)} ج*`).join('\n');
  const disc=+o.discount>0?`\n🏷️ الخصم${o.coupon_code?' ('+o.coupon_code+')':''}: -${n(o.discount)} ج`:'';
  const fee=+o.delivery_fee>0?`\n🚚 مصاريف التوصيل: *${n(o.delivery_fee)} ج*`:'';
  const trackUrl=`${STORE_URL}track.html?n=${encodeURIComponent(o.order_number)}`;
  return `مرحباً *${o.customer_name}* 👋\nتفاصيل فاتورة طلبك من *كيتشن فاست* 🥩🔥\n\n`+
    `🧾 *رقم الطلب:* ${o.order_number}\n`+
    `📌 *حالة الطلب:* ${ST[o.status]||o.status}\n`+
    `📍 *العنوان:* ${o.address}${o.area?' - '+o.area:''}\n`+
    `💳 *طريقة الدفع:* ${o.payment_method}\n\n`+
    `*الأصناف:*\n${items}\n`+
    `──────────────`+
    `${disc}${fee}\n`+
    `💰 *الإجمالي الكلي: ${n(o.total)} ج*\n\n`+
    `📦 *تابع حالة طلبك لحظة بلحظة من هنا:*\n${trackUrl}\n\n`+
    `شكراً لاختيارك كيتشن فاست 💛`;
}

function openReceiptModal(orderId){
  const o=ORDERS_MAP[orderId];
  if(!o)return;
  ACTIVE_ORDER=o;
  const fullAddr=[o.address,o.area].filter(Boolean).join(' - ');
  const rows=(o.order_items||[]).map(i=>`
    <tr>
      <td>${esc(i.product_name)}</td>
      <td>${esc(w(i.quantity_kg))}</td>
      <td>${n(i.line_total)} ج</td>
    </tr>`).join('');
  const discHtml=+o.discount>0?`<div class="rp-extra"><span>الخصم${o.coupon_code?' ('+esc(o.coupon_code)+')':''}</span><span>-${n(o.discount)} ج</span></div>`:'';
  const feeHtml=+o.delivery_fee>0?`<div class="rp-extra"><span>مصاريف التوصيل</span><span>${n(o.delivery_fee)} ج</span></div>`:'';

  $('receipt-paper').innerHTML=`
    <div class="rp-logo">KF</div>
    <div class="rp-en">KITCHEN FAST</div>
    <div class="rp-ar">كيتشن فاست</div>
    <div class="rp-sub">متخصصون في المشويات الجاهزة</div>
    <hr class="rp-hr">
    <div class="rp-title">طلب جديد من كيتشن فاست</div>
    <div class="rp-subtitle">ORDER RECEIPT</div>
    <div class="rp-num">${esc(o.order_number)}</div>
    <div class="rp-sec-h">بيانات العميل</div>
    <hr class="rp-dash">
    <div class="rp-info">
      <div class="rp-info-row"><span>الاسم</span><span>${esc(o.customer_name)}</span></div>
      <div class="rp-info-row"><span>الموبايل</span><span dir="ltr">${esc(o.phone)}</span></div>
      <div class="rp-info-row"><span>العنوان</span><span>${esc(fullAddr)}</span></div>
    </div>
    <table class="rp-tbl">
      <thead>
        <tr>
          <th>الصنف</th>
          <th>الكمية</th>
          <th>السعر</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    ${discHtml}
    ${feeHtml}
    <div class="rp-tot-box">
      <span>الإجمالي</span>
      <span>${n(o.total)} ج</span>
    </div>
    <div class="rp-meta">
      <div class="rp-meta-row"><span>طريقة الدفع</span><span>${esc(o.payment_method)}</span></div>
      ${o.notes?`<div class="rp-meta-row"><span>ملاحظات</span><span>${esc(o.notes)}</span></div>`:''}
    </div>
    <hr class="rp-dash">
    <div class="rp-thx">شكراً لاختيارك كيتشن فاست</div>
    <div class="rp-thx-sub">منتجات مجهزة بعناية</div>
    <div class="rp-qr" id="rp-qr-box"></div>
    <div class="rp-qr-txt">امسح الكود واطلب دلوقتي</div>
    <div class="rp-phones">
      <div>واتساب: <span dir="ltr">${esc(STORE_WA)}</span></div>
      <div>للتواصل: <span dir="ltr">${esc(SECOND_PHONE)}</span></div>
    </div>
    <hr class="rp-hr">
    <div class="rp-foot-en">KITCHEN FAST</div>
    <div class="rp-foot-ar">نتمنى لك وجبة شهية</div>
  `;

  $('rp-qr-box').innerHTML='';
  if(window.QRCode){
    new window.QRCode($('rp-qr-box'),{
      text:STORE_URL,
      width:110,
      height:110,
      colorDark:'#000000',
      colorLight:'#ffffff',
      correctLevel:window.QRCode.CorrectLevel.M
    });
  }

  $('rmodal').classList.add('on');
}

async function renderReceiptBlob(){
  if(!window.html2canvas)throw new Error('مكتبة الصور غير محملة');
  const el=$('receipt-paper');
  const canvas=await window.html2canvas(el,{scale:3,backgroundColor:'#ffffff',useCORS:true});
  return new Promise(res=>canvas.toBlob(res,'image/png'));
}

$('btn-close-rm').onclick=()=>$('rmodal').classList.remove('on');
$('rmodal').onclick=e=>{if(e.target===$('rmodal'))$('rmodal').classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('rmodal').classList.contains('on'))$('rmodal').classList.remove('on')});
$('btn-print').onclick=()=>window.print();

$('btn-dl-img').onclick=async()=>{
  if(!ACTIVE_ORDER)return;
  try{
    toast('جاري تجهيز صورة الفاتورة...');
    const blob=await renderReceiptBlob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`receipt-${ACTIVE_ORDER.order_number}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('تم تحميل صورة الفاتورة');
  }catch(e){fail(e)}
};

$('btn-wa-img').onclick=async()=>{
  if(!ACTIVE_ORDER)return;
  const o=ACTIVE_ORDER;
  try{
    toast('جاري تجهيز الصورة وفتح واتساب...');
    const blob=await renderReceiptBlob();
    let copied=false;
    if(navigator.clipboard&&window.ClipboardItem){
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        copied=true;
      }catch(_){copied=false}
    }
    if(!copied){
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`receipt-${o.order_number}.png`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
    }
    const msg=buildWaMessage(o);
    window.open(wa(o,msg),'_blank','noopener');
    toast(copied?'تم نسخ صورة الفاتورة! اعمل لصق (Ctrl+V) جوه شات واتساب':'تم تحميل صورة الفاتورة وفتح واتساب لإرفاقها');
  }catch(e){
    window.open(wa(o,buildWaMessage(o)),'_blank','noopener');
  }
};

async function orders(){
  const d=ok(await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100));
  ORDERS_MAP={};
  d.forEach(o=>{ORDERS_MAP[o.id]=o});
  V.innerHTML=d.length?d.map(o=>`<div class="c" data-id="${o.id}" data-sub="${o.subtotal}" data-disc="${o.discount||0}"><div class="r"><b>${esc(o.order_number)}</b><span>${esc(o.customer_name)} · <span dir="ltr">${esc(o.phone)}</span></span><b class="g">${n(o.total)} ج</b>
<select data-a="st">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${o.status==k?' selected':''}>${v}</option>`).join('')}</select></div>
<details><summary>التفاصيل</summary><p>${new Date(o.created_at).toLocaleString('en-US')}<br>العنوان: ${esc(o.address)} ${esc(o.area||'')}<br>الدفع: ${esc(o.payment_method)}${o.notes?'<br>ملاحظات: '+esc(o.notes):''}</p>
${o.order_items.map(i=>`<div class="l"><span>${esc(i.product_name)} × ${w(i.quantity_kg)}</span><span>${n(i.line_total)} ج</span></div>`).join('')}
<p>المجموع ${n(o.subtotal)} · خصم ${n(o.discount)}${o.coupon_code?' ('+esc(o.coupon_code)+')':''} · توصيل ${n(o.delivery_fee)}</p>
<div class="r"><label>مصاريف التوصيل (ج)<input type="number" min="0" data-fee value="${+o.delivery_fee||0}"></label><button type="button" class="b" data-a="fee">حفظ التوصيل</button></div>
<div class="r" style="margin-top:8px">
  <button type="button" class="b pr" data-a="rcp">🖨️ فاتورة / طباعة 80mm</button>
  <button type="button" class="b wa" data-a="warc">📲 إرسال الفاتورة واتساب</button>
  <a class="b" target="_blank" rel="noopener" href="${wa(o,`مرحباً ${o.customer_name}، بخصوص طلبك ${o.order_number} من كيتشن فاست: ${ST[o.status]}${feeTxt(o)}`)}">واتساب سريع</a>
  ${o.status=='delivered'?`<a class="b" target="_blank" rel="noopener" href="${wa(o,`شكراً لتعاملك مع كيتشن فاست! يسعدنا رأيك في طلبك: ${location.origin}${location.pathname.replace(/[^/]*$/,'')}review.html?t=${o.review_token}`)}">إرسال رابط التقييم</a>`:''}
</div></details></div>`).join(''):'<p class="m">لا توجد طلبات بعد.</p>';
}

let CATS=[];
async function products(){
  CATS=ok(await sb.from('categories').select('*').order('sort_order'));
  const d=ok(await sb.from('products').select('*').order('sort_order'));
  const co=v=>CATS.map(c=>`<option value="${c.id}"${c.id==v?' selected':''}>${esc(c.name)}</option>`).join('');
  V.innerHTML=`<div class="c" id="np"><b>صنف جديد</b><div class="r"><input data-f="name" placeholder="اسم الصنف"><select data-f="category_id">${co()}</select><input data-f="price_per_kg" type="number" min="0" placeholder="سعر الكيلو"><button type="button" class="b" data-a="add">إضافة</button></div></div>`+
  d.map(p=>`<div class="c" data-id="${p.id}"><div class="r">${p.image_url?`<img class="th" src="${esc(p.image_url)}" alt="">`:'<span class="th"></span>'}<input data-f="name" value="${esc(p.name)}"><select data-f="category_id">${co(p.category_id)}</select><label>السعر / كيلو<input data-f="price_per_kg" type="number" min="0" value="${p.price_per_kg}"></label><label>خصم %<input data-f="discount_percent" type="number" min="0" max="100" value="${p.discount_percent}"></label></div>
<div class="r">${[['is_available','متاح'],['is_best_seller','الأكثر طلباً'],['is_new','جديد'],['is_active','ظاهر في المتجر']].map(([k,l])=>`<label><span><input type="checkbox" data-f="${k}"${p[k]?' checked':''}>${l}</span></label>`).join('')}
<label class="b">رفع صورة<input type="file" accept="image/*" data-a="img" hidden></label><button type="button" class="b" data-a="save">حفظ</button><button type="button" class="b d" data-a="del">حذف</button></div></div>`).join('');
}
const rd=c=>{const o={};c.querySelectorAll('[data-f]').forEach(e=>o[e.dataset.f]=e.type=='checkbox'?e.checked:e.type=='number'?(e.value===''?null:+e.value):e.value);return o};
async function up(f){
  if(f.size>5e6)throw new Error('الصورة كبيرة (أقصى حجم 5 ميجا)');
  const p=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+((f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').slice(0,5)||'jpg');
  ok(await sb.storage.from('store-images').upload(p,f,{contentType:f.type}));
  return sb.storage.from('store-images').getPublicUrl(p).data.publicUrl;
}

async function reviews(){
  const d=ok(await sb.from('reviews').select('*,orders(order_number)').order('created_at',{ascending:false}));
  V.innerHTML=d.length?d.map(r=>`<div class="c" data-id="${r.id}"><div class="r"><b class="g">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</b><span>${esc(r.customer_name)} · ${esc(r.orders?.order_number||'')}</span><span class="${r.is_approved?'g':'m'}">${r.is_approved?'ظاهر':'بانتظار الموافقة'}</span></div><p>${esc(r.comment||'')}</p><div class="r"><button type="button" class="b" data-a="ap" data-v="${r.is_approved?0:1}">${r.is_approved?'إخفاء':'اعتماد'}</button><button type="button" class="b d" data-a="rd">حذف</button></div></div>`).join(''):'<p class="m">لا توجد تقييمات بعد.</p>';
}

const SF=[['tagline','الشعار'],['whatsapp','رقم واتساب (بصيغة 20...)'],['payment_number','رقم التحويل (إنستا باي / محفظة)'],['facebook_url','رابط فيسبوك'],['instagram_url','رابط إنستغرام'],['tiktok_url','رابط تيك توك'],['location_url','رابط اللوكيشن'],['address','العنوان'],['working_hours','مواعيد العمل'],['offers_banner','شريط العروض (افصل بين أكتر من رسالة بعلامة |)'],['min_order','الحد الأدنى للطلب (ج)']];
let HERO=[];
function drawHero(){$('hr').innerHTML=HERO.map((u,i)=>`<span><img class="th" src="${esc(u)}" alt=""><button type="button" class="b d" data-a="hrm" data-i="${i}">×</button></span>`).join('')||'<span class="m">لا توجد صور</span>'}
async function settings(){
  const s=ok(await sb.from('store_settings').select('*').eq('id',1).single());
  HERO=s.hero_images||[];
  const z=(s.delivery_zones||[]).map(x=>x.name+' | '+x.fee).join('\n');
  V.innerHTML=`<div class="c" id="st">${SF.map(([k,l])=>`<label>${l}<input data-f="${k}"${k=='min_order'?' type="number" min="0"':''} value="${esc(s[k]??'')}"></label>`).join('')}
<label>مناطق التوصيل (سطر لكل منطقة: الاسم | السعر)<textarea data-f="zones" rows="4">${esc(z)}</textarea></label>
<div><b>صور الهيدر</b><div class="r" id="hr"></div><label class="b">إضافة صورة<input type="file" accept="image/*" data-a="hero" hidden></label></div>
<button type="button" class="b" data-a="ss">حفظ الإعدادات</button></div>`;
  drawHero();
}

V.onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName=='INPUT'||b.tagName=='SELECT')return;
  const a=b.dataset.a,c=b.closest('[data-id]'),id=c&&c.dataset.id;
  try{
    if(a=='rcp'){openReceiptModal(id)}
    else if(a=='warc'){openReceiptModal(id);setTimeout(()=>$('btn-wa-img').click(),250)}
    else if(a=='fee'){const v=+c.querySelector('[data-fee]').value;if(!(v>=0))return toast('اكتب مبلغ صحيح',1);const sub=+c.dataset.sub,dc=+c.dataset.disc||0;ok(await sb.from('orders').update({delivery_fee:v,total:sub-dc+v}).eq('id',id));toast('تم حفظ التوصيل');await orders();const d=V.querySelector('[data-id="'+id+'"] details');if(d)d.open=true}
    else if(a=='add'){const o=rd($('np'));if(!o.name.trim()||o.price_per_kg==null)return toast('اكتب الاسم والسعر',1);ok(await sb.from('products').insert(o));toast('تمت الإضافة');go('products')}
    else if(a=='save'){ok(await sb.from('products').update(rd(c)).eq('id',id));toast('تم الحفظ')}
    else if(a=='del'){if(!confirm('حذف الصنف نهائياً؟'))return;ok(await sb.from('products').delete().eq('id',id));toast('تم الحذف');go('products')}
    else if(a=='ap'){ok(await sb.from('reviews').update({is_approved:b.dataset.v=='1'}).eq('id',id));go('reviews')}
    else if(a=='rd'){if(!confirm('حذف التقييم؟'))return;ok(await sb.from('reviews').delete().eq('id',id));go('reviews')}
    else if(a=='hrm'){HERO.splice(+b.dataset.i,1);drawHero()}
    else if(a=='ss'){
      const o=rd($('st')),z=(o.zones||'').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x[0]).map(x=>({name:x[0],fee:+x[1]||0}));
      delete o.zones;for(const k in o)if(o[k]==='')o[k]=null;
      o.min_order=o.min_order||0;o.delivery_zones=z;o.hero_images=HERO;
      ok(await sb.from('store_settings').update(o).eq('id',1));toast('تم حفظ الإعدادات');
    }
  }catch(x){fail(x)}
};
V.onchange=async e=>{
  const el=e.target,a=el.dataset.a,c=el.closest('[data-id]');
  try{
    if(a=='st'){ok(await sb.from('orders').update({status:el.value}).eq('id',c.dataset.id));toast('تم تحديث الحالة');go('orders')}
    else if(a=='img'&&el.files[0]){toast('جاري رفع الصورة...');const u=await up(el.files[0]);ok(await sb.from('products').update({image_url:u}).eq('id',c.dataset.id));toast('تم رفع الصورة');go('products')}
    else if(a=='hero'&&el.files[0]){toast('جاري رفع الصورة...');HERO.push(await up(el.files[0]));drawHero();toast('اضغط حفظ الإعدادات لتثبيت الصورة')}
  }catch(x){fail(x)}
};
</script>
</body>
</html>
